<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TopHat · Sign in</title>
<style>
  :root{--bg:#0b0f17;--surface:#111726;--border:#222c42;--text:#e6ebf5;
    --muted:#8b97b0;--accent:#34d399;--short:#f87171}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
    radial-gradient(1200px 600px at 50% -10%,rgba(52,211,153,.08),transparent),var(--bg);
    color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:grid;place-items:center}
  .card{width:360px;background:var(--surface);border:1px solid var(--border);
    border-radius:16px;padding:32px;box-shadow:0 24px 60px -20px rgba(0,0,0,.7)}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px;
    margin-bottom:6px;letter-spacing:-.02em}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:
    linear-gradient(135deg,var(--accent),#22d3ee);display:grid;place-items:center;
    color:#04130d;font-weight:800;font-size:17px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--border);
    background:var(--bg);color:var(--text);font-size:14px}
  input:focus{outline:none;border-color:var(--accent)}
  button{width:100%;margin-top:22px;padding:12px;border-radius:10px;border:none;
    background:var(--accent);color:#04130d;font-weight:700;font-size:14px;cursor:pointer}
  button:hover{filter:brightness(1.07)}
  .err{color:var(--short);font-size:13px;margin-top:14px;min-height:18px}
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="brand"><span class="dot">T</span> TopHat</div>
    <div class="sub">Sign in to your trading dashboard</div>
    <label>Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script>
document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent='';
  const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({email:email.value, password:password.value})});
  if(r.ok){ location.href='/'; }
  else { err.textContent = 'Invalid email or password.'; }
};
</script>
</body>
</html>
